# One-click setup on Render: New > Blueprint > pick this repo
services:
  - type: web
    name: ea-license-site
    runtime: docker
    plan: starter            # paid plan is required for the disk below
    healthCheckPath: /login
    disk:
      name: data             # keeps the database and EA files between deploys
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false          # Render asks you for this when you create the Blueprint
      - key: ADMIN_PASSWORD
        sync: false
      - key: SIGNUP_MODE
        value: approval
      - key: COOKIE_SECURE
        value: "true"
      - key: SITE_NAME
        value: 5ABI.FX
      - key: TRIAL_DAYS
        value: "15"
      - key: PRICE_TEXT
        value: $20/month
      - key: PAYMENT_URL
        sync: false          # your payment page or Discord invite
      - key: GOOGLE_CLIENT_ID
        sync: false          # Sign in with Google (see README)
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false          # card payments (see README)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BACKUP_PASSWORD
        sync: false          # nightly backup lock (see README: Security and backups)
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
